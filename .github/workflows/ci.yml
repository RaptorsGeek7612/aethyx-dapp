name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend — compile, test, lint, format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      # pnpm avant setup-node : c'est ce qui permet à setup-node de trouver le store pnpm et de
      # le mettre en cache. L'ordre inverse laisse le cache vide sans signaler d'erreur.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # --frozen-lockfile fait échouer le job si le lockfile ne correspond plus aux package.json,
      # au lieu de le mettre à jour en silence : la CI doit installer exactement ce qui a été
      # relu et committé, jamais une résolution fraîche.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Compile contracts
        run: pnpm exec hardhat build

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Run Solidity + TypeScript tests
        run: pnpm exec hardhat test

      - name: Lint Solidity (solhint)
        run: pnpm run lint:sol

      - name: Lint TypeScript (eslint)
        run: pnpm run lint:ts

      - name: Check formatting (Prettier)
        run: pnpm run format:check

  frontend:
    name: Frontend — lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Lint (eslint)
        run: pnpm run lint

      - name: Check formatting (Prettier)
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build
        # Aucune adresse NEXT_PUBLIC_* n'est définie en CI : config/contracts.ts est conçu pour
        # basculer dans un état « non configuré » plutôt que planter, donc le build doit réussir
        # sans elles.
        run: pnpm run build
