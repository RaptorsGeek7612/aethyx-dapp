name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend — compile, test, lint, format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npx hardhat build

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run Solidity + TypeScript tests
        run: npx hardhat test

      - name: Lint Solidity (solhint)
        run: npm run lint:sol

      - name: Lint TypeScript (eslint)
        run: npm run lint:ts

      - name: Check formatting (Prettier)
        run: npm run format:check

  frontend:
    name: Frontend — lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        # No NEXT_PUBLIC_* contract addresses are set in CI — config/contracts.ts is designed to
        # fall back to an "unconfigured" state instead of crashing, so the build must succeed
        # without them (see isContractsConfigured/isOracleConfigured).
        run: npm run build
